# Hermes's ServiceAccount may manage SandboxClaims and Sandboxes in hermes-sandboxes, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-sandbox-manager
  namespace: hermes-sandboxes
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, get, list, watch, patch, delete]   # patch: heartbeat annotation
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch, patch]                   # patch: suspend / resume
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-sandbox-manager
  namespace: hermes-sandboxes
subjects:
  - { kind: ServiceAccount, name: hermes, namespace: hermes }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-sandbox-manager
